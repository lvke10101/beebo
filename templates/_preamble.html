<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" name="viewport"/>
<title>Beebo - Campus Community</title>
<!-- Applied before any CSS loads / first paint, so the page never
     flashes light-then-dark (or vice versa) on load. Kept inline and
     synchronous on purpose - an external file would arrive too late.
     See static/js/theme.js for the rest of the theme system. -->
<script>
(function() {
	try {
		var stored = localStorage.getItem('beebo-theme');
		if (stored === 'dark') document.documentElement.classList.add('dark');
	} catch (e) {}
})();
</script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<script src="/static/js/tailwind-config.js"></script>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="text-gray-800 antialiased h-screen flex flex-col">
