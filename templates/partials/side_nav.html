<!-- BEGIN: Side Navigation Drawer -->
<!-- Tap-to-close area behind the panel. Its opacity is driven by
     side-nav.js in lockstep with the panel's drag position (see
     setSideNavWidth), not by a CSS class, so it can track the finger
     in real time along with the panel. -->
<div id="side-nav-backdrop" class="fixed inset-0 bg-black z-40 opacity-0 pointer-events-none"></div>

<!-- #side-nav is a clipping shell: its WIDTH (not a transform) is driven
     by side-nav.js and animates through three snap points - closed (0),
     mini (icon rail, see #side-nav-mini), and full (labeled drawer, see
     #side-nav-full). Growing the shell's width is what makes the drawer
     read as "progressively expanding" rather than swapping layouts. -->
<aside id="side-nav" class="fixed top-0 left-0 h-full bg-white z-50 rounded-r-3xl shadow-[4px_0_24px_rgba(0,0,0,0.12)] overflow-hidden" style="width: 0px;">

	<!-- Mini icon rail: first swipe stop. Fixed width, cross-fades out as
	     the shell grows past it toward the full drawer (see
	     setSideNavWidth). Same nav destinations as the full drawer, icon-only. -->
	<div id="side-nav-mini" class="absolute top-0 left-0 h-full flex flex-col items-center" style="width: 76px;">
		<div class="pt-8 pb-4 shrink-0">
			<img src="/static/images/beebo-icon.png" alt="Beebo" class="w-9 h-9 rounded-full object-cover">
		</div>
		<nav class="flex-1 flex flex-col items-center gap-2 pt-2">
			<button id="side-nav-mini-home" type="button" data-nav-key="home" class="side-nav-link flex items-center justify-center w-11 h-11 rounded-xl text-brand-red bg-red-50" onclick="closeSideNav(); showView('feed');" aria-label="Home">
				<svg class="w-5 h-5 shrink-0" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
					<path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.689z"></path>
					<path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z"></path>
				</svg>
			</button>
			<button id="side-nav-mini-courses" type="button" data-nav-key="courses" class="side-nav-link flex items-center justify-center w-11 h-11 rounded-xl text-gray-500" onclick="closeSideNav(); showView('courses');" aria-label="Courses">
				<svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
					<path d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" stroke-linecap="round" stroke-linejoin="round"></path>
				</svg>
			</button>
			<button type="button" data-nav-key="library" class="side-nav-link flex items-center justify-center w-11 h-11 rounded-xl text-gray-500" aria-label="Library">
				<svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
					<path d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.332A48.36 48.36 0 0012 9.75c-2.551 0-5.056.2-7.5.582V21M3 21h18M12 6.75h.008v.008H12V6.75z" stroke-linecap="round" stroke-linejoin="round"></path>
				</svg>
			</button>
			<button type="button" data-nav-key="chat" class="side-nav-link flex items-center justify-center w-11 h-11 rounded-xl text-gray-500" onclick="closeSideNav(); showView('chat');" aria-label="Chat">
				<svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
					<path d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z" stroke-linecap="round" stroke-linejoin="round"></path>
				</svg>
			</button>
			<button id="side-nav-mini-profile" type="button" data-nav-key="profile" class="side-nav-link flex items-center justify-center w-11 h-11 rounded-xl text-gray-500" onclick="closeSideNav(); showView('profile');" aria-label="Profile">
				<svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
					<path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" stroke-linecap="round" stroke-linejoin="round"></path>
				</svg>
			</button>
		</nav>
		<div class="pb-5 shrink-0 flex flex-col items-center gap-3">
			<button type="button" class="theme-toggle-btn flex items-center justify-center w-8 h-8 rounded-full text-gray-500 hover:bg-gray-100" onclick="toggleTheme()" aria-label="Switch to dark mode">
				<i class="theme-toggle-icon fa-solid fa-moon text-[15px]"></i>
			</button>
			<img id="side-nav-mini-avatar" src="" alt="" class="w-9 h-9 rounded-full object-cover bg-gray-100">
		</div>
	</div>

	<!-- Full labeled drawer: second swipe stop. Fixed at its natural full
	     width regardless of the shell's current width, so growing the
	     shell reveals more of it from the left edge while it cross-fades
	     in over the mini rail. Unchanged from the previously shipped drawer. -->
	<div id="side-nav-full" class="absolute top-0 left-0 h-full w-[82vw] max-w-[300px] bg-white flex flex-col">
		<div class="px-6 pt-8 pb-2 shrink-0">
			<img src="/static/images/beebo-logo.png" alt="Beebo" class="h-9 w-auto object-contain object-left">
		</div>
		<nav class="flex-1 px-4 pt-4 space-y-1 overflow-y-auto">
			<button id="side-nav-home" type="button" data-nav-key="home" class="side-nav-link w-full flex items-center gap-4 px-3 py-3 rounded-xl text-brand-red bg-red-50 font-semibold" onclick="closeSideNav(); showView('feed');">
				<svg class="w-6 h-6 shrink-0" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
					<path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.689z"></path>
					<path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z"></path>
				</svg>
				<span class="text-[15px]">Home</span>
			</button>
			<button id="side-nav-courses" type="button" data-nav-key="courses" class="side-nav-link w-full flex items-center gap-4 px-3 py-3 rounded-xl text-gray-500 font-medium" onclick="closeSideNav(); showView('courses');">
				<svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
					<path d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" stroke-linecap="round" stroke-linejoin="round"></path>
				</svg>
				<span class="text-[15px]">Courses</span>
			</button>
			<!-- Library: no view exists for this yet, so left unwired here,
			     same as the app's other placeholder nav items. Chat is wired
			     below. -->
			<button type="button" data-nav-key="library" class="side-nav-link w-full flex items-center gap-4 px-3 py-3 rounded-xl text-gray-500 font-medium">
				<svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
					<path d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.332A48.36 48.36 0 0012 9.75c-2.551 0-5.056.2-7.5.582V21M3 21h18M12 6.75h.008v.008H12V6.75z" stroke-linecap="round" stroke-linejoin="round"></path>
				</svg>
				<span class="text-[15px]">Library</span>
			</button>
			<button type="button" data-nav-key="chat" class="side-nav-link w-full flex items-center gap-4 px-3 py-3 rounded-xl text-gray-500 font-medium" onclick="closeSideNav(); showView('chat');">
				<svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
					<path d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z" stroke-linecap="round" stroke-linejoin="round"></path>
				</svg>
				<span class="text-[15px]">Chat</span>
			</button>
			<button id="side-nav-profile" type="button" data-nav-key="profile" class="side-nav-link w-full flex items-center gap-4 px-3 py-3 rounded-xl text-gray-500 font-medium" onclick="closeSideNav(); showView('profile');">
				<svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
					<path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" stroke-linecap="round" stroke-linejoin="round"></path>
				</svg>
				<span class="text-[15px]">Profile</span>
			</button>
		</nav>
		<div class="border-t border-gray-100 px-4 py-4 flex items-center gap-3 shrink-0">
			<img id="side-nav-avatar" src="" alt="" class="w-11 h-11 rounded-full object-cover shrink-0 bg-gray-100">
			<div class="flex-1 min-w-0">
				<p id="side-nav-name" class="font-bold text-[15px] text-gray-900 truncate"></p>
				<p id="side-nav-handle" class="text-[13px] text-gray-500 truncate"></p>
			</div>
			<button type="button" class="theme-toggle-btn text-gray-400 hover:text-gray-600 p-2 shrink-0" onclick="toggleTheme()" aria-label="Switch to dark mode">
				<i class="theme-toggle-icon fa-solid fa-moon text-lg"></i>
			</button>
			<button type="button" onclick="handleLogout()" class="text-gray-400 hover:text-gray-600 p-2 -mr-2 shrink-0" aria-label="Log out">
				<i class="fa-solid fa-arrow-right-from-bracket text-lg"></i>
			</button>
		</div>
	</div>
</aside>
<!-- END: Side Navigation Drawer -->
